      g.gain.value = .04;

      g.connect(AC.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
      o.stop(AC.currentTime + d);
  }
  catch (e) { } }
  function sndBtn() { $('#bSnd').textContent = S.sound ? '🔊' : '🔇'; }
  $('#bSnd').onclick = () => { S.sound = !S.sound; save(); sndBtn(); beep(700); };
  $('#bFacts').onclick = () => { beep(); facts(); };
  sndBtn();

  /* ==========================================================
     4. دوال مساعدة (Helpers)
     ========================================================== */
  /* helpers */
  const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  function rng(seed) { let h = 2166136261; for (const ch of String(seed)) {
      h ^= ch.charCodeAt(0);
      h = Math.imul(h, 16777619);
  } return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(a, r = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
  } return a; }
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
  const friend = () => { const m = location.hash.match(/^#vs-(\d{1,3})$/); return m ? Math.min(100, +m[1]) : null; };
  const lvOf = p => LV.find(l => p <= l.max);

  /* ==========================================================
     5. الشاشات: الرئيسية، الاختبار، النتائج، الحقائق (Views)
     ========================================================== */
  /* views */
  function home() {
      const f = friend(), dd = S.daily[todayKey()];
      app.innerHTML = `<section class="hero">
      ${f !== null ? `<div class="banner">صديقك حصل على <b>${f}%</b> — هل تستطيع التفوق عليه؟ 😈</div>` : ''}
      <div class="brain" data-t="🧠">🧠</div>
      <h1>HOW <em>BRAIN ROTTEN</em> ARE YOU?</h1>
      <p class="sub">20 سؤالاً صادقاً عن هاتفك وميمزك وعاداتك. النتيجة مضحكة، والاعتراف أول خطوات التعافي.</p>
      <button class="cta" id="go">START THE TEST</button>
      <div class="row">
        ${run ? `<button class="sec" id="resume">متابعة من السؤال ${run.i + 1}</button>` : ''}
        <button class="sec" id="daily">${dd !== undefined ? 'تحدي اليوم ✅ ' + dd + '%' : '🔥 تحدي اليوم'}</button>
        <button class="sec" id="rand">🎲 أسئلة عشوائية</button>
        ${S.last !== null ? `<button class="sec" id="last">آخر نتيجة: ${S.last}%</button>` : ''}
      </div>
      <div class="count">أجريت ${S.tests} اختبار على هذا الجهاز (عدّاد محلي فقط، بلا أرقام وهمية)</div>
    </section>`;
      $('#go').onclick = () => start('full');
      $('#rand').onclick = () => start('random');
      $('#daily').onclick = () => start('daily');
      if (run)
          $('#resume').onclick = () => { beep(); quiz(); };
      if (S.last !== null)
          $('#last').onclick = () => result(S.lastData || { p: S.last, ans: {}, order: [...Q.keys()] });
  }
  function start(mode) {
      beep(660);
      const all = [...Q.keys()];
      let order = all;
      if (mode === 'random')
          order = shuffle(all);
      if (mode === 'daily')
          order = shuffle(all, rng(todayKey())).slice(0, 10);
      run = { mode, order, i: 0, ans: {} };
      saveRun();
      quiz();
  }
  function quiz() {
      const idx = run.order[run.i], q = Q[idx], n = run.order.length, cur = run.ans[idx];
      app.innerHTML = `<div class="bar"><i style="width:${run.i / n * 100}%"></i></div>
    <div class="meta"><span>السؤال ${run.i + 1} من ${n}${run.mode === 'daily' ? ' · تحدي اليوم' : ''}</span><span>${CATS[q.c]}</span></div>
    <div class="q"><h2>${q.t}</h2>${q.o.map((o, k) => `<button class="opt${cur === k ? ' on' : ''}" data-k="${k}">${o}</button>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><button class="nb" id="back" ${run.i === 0 ? 'disabled style="opacity:.4"' : ''}>← السابق</button><button class="nb" id="quit">خروج</button></div>`;
      requestAnimationFrame(() => { const b = $('.bar i'); if (b)
          b.style.width = (run.i + (cur !== undefined ? 1 : 0)) / n * 100 + '%'; });
      document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
          run.ans[idx] = +b.dataset.k;
          beep(400 + run.ans[idx] * 120);
          b.classList.add('on');
          setTimeout(() => { run.i++; saveRun(); run.i >= n ? finish() : quiz(); }, 220);
          saveRun();
      });
      $('#back').onclick = () => { if (run.i > 0) {
          beep(300);
          run.i--;
          saveRun();
          quiz();
      } };
      $('#quit').onclick = () => { saveRun(); home(); };
  }
  function calc(order, ans) {
      let sum = 0, cat = {};
      order.forEach(i => { const m = Q[i].o.length - 1, v = (ans[i] ?? 0) / m; sum += v; (cat[Q[i].c] = cat[Q[i].c] || []).push(v); });
      const raw = sum / order.length;
      // منحنى متوازن: الإجابات المتوسطة تعطي نتيجة معتدلة، و100% يتطلب أشد إجابة في كل سؤال
      const p = Math.round(100 * Math.pow(raw, 1.25));
      return { p, cat, raw };
  }
  function finish() {
      const { p } = calc(run.order, run.ans);
      const data = { p, ans: run.ans, order: run.order, mode: run.mode };
      S.tests++;
      S.last = p;
      S.lastData = data;
      if (run.mode === 'daily')
          S.daily[todayKey()] = p;
      save();
      run = null;
      lsSet(KEY + '_run', null);
      result(data, true);
  }
  function result(d, anim) {
      const { p, cat } = calc(d.order, d.ans), lv = lvOf(p), f = friend();
      const cats = Object.entries(cat).map(([k, a]) => [k, Math.round(a.reduce((x, y) => x + y, 0) / a.length * 100)]).sort((a, b) => b[1] - a[1]);
      let hi = 0, lo = 0;
      d.order.forEach(i => { const a = d.ans[i] ?? 0, m = Q[i].o.length - 1; if (a === m)
          hi++; if (a === 0)
          lo++; });
      const top = cats.filter(c => c[1] >= 40).slice(0, 3);
      const R = 90, C = 2 * Math.PI * R;
      app.innerHTML = `<section class="res">
      <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="${R}" fill="none" stroke="#25103f" stroke-width="16"/><circle id="arc" cx="110" cy="110" r="${R}" fill="none" stroke="${lv.col}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="filter:drop-shadow(0 0 8px ${lv.col});transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)"/></svg><div class="n" id="num">0%</div></div>
      <div class="lvl" style="color:${lv.col}">${lv.n} ${lv.e}</div>
      <div class="roast"><b>${lv.d}</b><br>${lv.r}</div>
      ${f !== null ? `<div class="banner">${p > f ? `تفوقت على صديقك (${f}%) بفارق ${p - f} نقطة تعفن 😈` : p < f ? `صديقك (${f}%) أكثر تعفناً منك بـ ${f - p} نقطة 🏆` : `تعادل مع صديقك (${f}%)! توأم دماغي 🤝`}</div>` : ''}
      <div class="card"><h3>العادات التي رفعت نتيجتك</h3>
        ${top.length ? top.map(([k, v]) => `<div style="margin:6px 0">• <b>${CATS[k]}</b>: ${HABIT[k]}</div>`).join('') : '<div>لا توجد عادة تتجاوز الحد. أنت تقريباً شخص طبيعي، مبروك (أو للأسف).</div>'}
        ${cats.map(([k, v]) => `<div class="hb"><span>${CATS[k]}</span><div class="bar"><i style="width:${v}%"></i></div><span>${v}%</span></div>`).join('')}
      </div>
      <div class="card"><h3>إحصائيات مصغرة</h3><div class="st"><div><b>${d.order.length}</b><span>سؤالاً أجبت</span></div><div><b>${hi}</b><span>إجابة بأقصى درجة تعفن</span></div><div><b>${lo}</b><span>إجابة سليمة تماماً</span></div></div></div>
      <div class="row">
        <button class="cta" id="share" style="font-size:15px;padding:12px 18px">📤 شارك كصورة</button>
        <button class="sec" id="copy">📋 نسخ كنص</button>
        <button class="sec" id="chal">⚔️ تحدَّ صديقاً</button>
        <button class="sec" id="again">🔄 إعادة الاختبار</button>
      </div>
      <p class="count">للمشاركة على Instagram أو TikTok أو Facebook: احفظ الصورة ثم انشرها من التطبيق.</p>
    </section>`;
      const set = v => { $('#arc').style.strokeDashoffset = C * (1 - v / 100); $('#num').textContent = Math.round(v) + '%'; };
      if (anim && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
          requestAnimationFrame(() => requestAnimationFrame(() => $('#arc').style.strokeDashoffset = C * (1 - p / 100)));
          const t0 = performance.now();
          (function tick(t) { const k = Math.min(1, (t - t0) / 1600); $('#num').textContent = Math.round(p * (1 - Math.pow(1 - k, 3))) + '%'; if (k < 1)
              requestAnimationFrame(tick); })(t0);
          beep(880, .2);
      }
      else
          set(p);
      const link = () => location.href.split('#')[0] + '#vs-' + p;
      const text = () => `🧠 حصلت على ${p}% في BRAIN ROT CALCULATOR!\nالمستوى: ${lv.n} ${lv.e}\n"${lv.d}"\nهل تستطيع التفوق عليّ؟ ${link()}`;
      const cp = async (t, m) => { try {
          await navigator.clipboard.writeText(t);
          toast(m);
      }
      catch (e) {
          prompt('انسخ النص:', t);
      } };
      $('#copy').onclick = () => { beep(); cp(text(), 'تم النسخ ✅'); };
      $('#chal').onclick = () => { beep(); cp(link(), 'تم نسخ رابط التحدي ✅'); };
      $('#again').onclick = () => { beep(); home(); };
      $('#share').onclick = () => shareImg(p, lv, text());
  }
  async function shareImg(p, lv, txt) {
      beep();
      const c = document.createElement('canvas');
      c.width = 1080;
      c.height = 1350;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 1080, 1350);
      g.addColorStop(0, '#08040f');
      g.addColorStop(1, '#2a0d55');
      x.fillStyle = g;
      x.fillRect(0, 0, 1080, 1350);
      x.textAlign = 'center';
      x.fillStyle = '#39ff6a';
      x.font = 'bold 54px Bungee,Impact,sans-serif';
      x.fillText('BRAIN ROT CALCULATOR', 540, 130);
      x.font = '160px serif';
      x.fillText('🧠', 540, 330);
      x.lineWidth = 34;
      x.lineCap = 'round';
      x.strokeStyle = '#25103f';
      x.beginPath();
      x.arc(540, 650, 210, 0, 7);
      x.stroke();
      x.strokeStyle = lv.col;
      x.shadowColor = lv.col;
      x.shadowBlur = 30;
      x.beginPath();
      x.arc(540, 650, 210, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p / 100);
      x.stroke();
      x.shadowBlur = 0;
      x.fillStyle = lv.col;
      x.font = 'bold 150px Bungee,Impact,sans-serif';
      x.fillText(p + '%', 540, 700);
      x.fillStyle = '#fff';
      x.font = 'bold 70px Bungee,Impact,sans-serif';
      x.fillText(lv.n + ' ' + lv.e, 540, 1000);
      x.fillStyle = '#d9c8ff';
      x.font = '42px Rubik,Tahoma,sans-serif';
      x.direction = 'rtl';
      x.fillText(lv.d, 540, 1090, 980);
      x.fillStyle = '#ff3df0';
      x.font = '38px Rubik,Tahoma,sans-serif';
      x.fillText('هل تستطيع التفوق عليّ؟ جرّب الاختبار', 540, 1220);
      x.fillStyle = '#a898c8';
      x.font = '26px Rubik,Tahoma,sans-serif';
      x.fillText('للترفيه فقط وليس تشخيصاً طبياً', 540, 1290);
      c.toBlob(async (b) => {
          if (!b)
              return toast('تعذر إنشاء الصورة');
          const file = new File([b], 'brain-rot.png', { type: 'image/png' });
          try {
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                  await navigator.share({ files: [file], text: txt });
                  return;
              }
          }
          catch (e) {
              if (e.name === 'AbortError')
                  return;
          }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(b);
          a.download = 'brain-rot.png';
          document.body.appendChild(a);
          a.click();
          a.remove();
          toast('تم حفظ الصورة 📥');
      });
  }
  function facts() {
      app.innerHTML = `<h1 style="font-size:28px">FUN FACTS</h1><p class="sub" style="margin-top:0">حقائق ساخرة (للضحك لا للمراجع العلمية)</p>${FACTS.map(f => `<div class="fact">${f}</div>`).join('')}<div class="row"><button class="cta" id="h" style="font-size:15px">← BACK</button></div>`;
      $('#h').onclick = () => { beep(); home(); };
  }

  /* ==========================================================
     6. التشغيل (Init)
     ========================================================== */
  addEventListener('hashchange', () => { if (!run)
      home(); });
  home();
</script>
